# Spring Config Import
spring.config.import=optional:file:.env[.properties]

# Application Name
spring.application.name=hrms-backend

# Datasource Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL Init
spring.sql.init.mode=never

# Jackson Timezone
spring.jackson.time-zone=Asia/Kolkata

# Server Configuration
server.port=8080
server.error.include-message=never
server.error.include-binding-errors=never

# App Custom Properties
app.frontend-url=${FRONTEND_URL}

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION}

# Cloudinary Configuration
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# SpringDoc/Swagger Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Logging Configuration
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.jdbc=INFO
logging.level.org.hibernate=INFO

# ===============================
# Password Reset Configuration
# ===============================
app.reset-password.token-expiry-minutes=15
app.reset-password.frontend-url=${FRONTEND_URL}/reset-password

# ===============================
# Email Configuration
# ===============================
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email sender details
app.email.from=${SPRING_MAIL_USERNAME}
app.email.subject-prefix=HRMS